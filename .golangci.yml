version: "2"
run:
  issues-exit-code: 1
linters:
  default: none
  enable:
    - asciicheck
    - bodyclose
    - contextcheck
    - dogsled
    - dupl
    - errcheck
    - errorlint
    - exhaustive
    - gocritic
    - gosec
    - govet
    - importas
    - ineffassign
    - misspell
    - nakedret
    - nolintlint
    - prealloc
    - predeclared
    - revive
    - staticcheck
    - thelper
    - unconvert
    - unparam
    - unused
    - wastedassign
  settings:
    dogsled:
      max-blank-identifiers: 3
    errcheck:
      check-type-assertions: false
    exhaustive:
      default-signifies-exhaustive: true
    funlen:
      lines: 100
      statements: 40
    goconst:
      min-len: 2
      min-occurrences: 4
    gocritic:
      disabled-checks:
        - appendAssign
        - commentFormatting
        - commentedOutCode
        - deferInLoop
        - emptyStringTest
        - ifElseChain
        - nestingReduce
        - paramTypeCombine
        - sloppyReassign
        - todoCommentWithoutDetail
        - unnamedResult
        - unnecessaryBlock
        - whyNoLint
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    nolintlint:
      require-explanation: false
      require-specific: true
    staticcheck:
      # Quick fixes (QF*) are refactoring suggestions that golangci-lint v1
      # never ran here; the other checks keep the v2 defaults.
      checks:
        - all
        - -QF*
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
    revive:
      rules:
        - name: indent-error-flow
          severity: warning
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Tests open fixture files and serve them from a mock server; the
      # paths come from the test suite, not from users.
      - path: _test\.go
        linters:
          - gosec
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: false
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
